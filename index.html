<h1>rclone-vps</h1>
<p>rclone-vps is a private, single-user configuration of the open-source tool <a href="https://rclone.org/">rclone</a>.
It stores encrypted backups of the owner&#39;s own server in the owner&#39;s own Google Drive.</p>
<p>It is not offered to the public and has no other users.</p>
